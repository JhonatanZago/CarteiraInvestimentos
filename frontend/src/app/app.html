<div class="app-shell">
  <header class="topbar"><div class="topbar-inner">
    <a class="brand" routerLink="/carteiras">Carteira<span>+</span></a>
    <nav class="main-nav" aria-label="Navegação principal" [class.open]="menuOpen()">
      <a routerLink="/dashboard" routerLinkActive="active" (click)="menuOpen.set(false)">Visão geral</a>
      <a routerLink="/carteiras" routerLinkActive="active" (click)="menuOpen.set(false)">Carteiras</a>
      <a routerLink="/acoes" routerLinkActive="active" (click)="menuOpen.set(false)">Ativos</a>
      <a routerLink="/corretoras" routerLinkActive="active" (click)="menuOpen.set(false)">Corretoras</a>
      <a routerLink="/vendas" routerLinkActive="active" (click)="menuOpen.set(false)">Vendas</a>
    </nav>
    <div class="topbar-actions"><button class="notification" type="button" aria-label="Notificações">●</button><button type="button" class="theme-toggle" (click)="themeService.toggleTheme()" [attr.aria-label]="themeService.isDark() ? 'Ativar tema claro' : 'Ativar tema escuro'" [title]="themeService.isDark() ? 'Ativar tema claro' : 'Ativar tema escuro'">@if (themeService.isDark()) {<span aria-hidden="true">☀</span>} @else {<span aria-hidden="true">☾</span>}</button><span class="avatar" aria-label="Perfil do usuário">JD</span><button class="menu-button" type="button" (click)="menuOpen.update(value => !value)" [attr.aria-expanded]="menuOpen()" aria-label="Abrir menu de navegação">☰</button></div>
  </div></header>
  <main class="content"><router-outlet /></main>
</div>
<section class="toasts" aria-live="polite">@for (toast of notifications.notifications(); track toast.id) { <button type="button" class="toast" [class]="toast.tone" (click)="notifications.dismiss(toast.id)">{{ toast.message }}</button> }</section>
