<div class="app-shell"><header class="topbar"><div class="topbar-inner"><a class="brand" routerLink="/visao-geral">Carteira<span>+</span></a><nav class="main-nav" aria-label="Navegação principal" [class.open]="menuOpen()"><a routerLink="/visao-geral" routerLinkActive="active" (click)="menuOpen.set(false)">Visão geral</a><a routerLink="/carteiras" routerLinkActive="active" (click)="menuOpen.set(false)">Carteiras</a><a routerLink="/acoes" routerLinkActive="active" (click)="menuOpen.set(false)">Ativos</a><a routerLink="/corretoras" routerLinkActive="active" (click)="menuOpen.set(false)">Corretoras</a><a routerLink="/vendas" routerLinkActive="active" (click)="menuOpen.set(false)">Vendas</a></nav><div class="topbar-actions"><button type="button" class="theme-toggle" (click)="themeService.toggleTheme()" [attr.aria-label]="themeService.isDark() ? 'Ativar tema claro' : 'Ativar tema escuro'">{{themeService.isDark()?'☀':'◐'}}</button><button class="menu-button" type="button" (click)="menuOpen.update(value=>!value)" [attr.aria-expanded]="menuOpen()" aria-label="Abrir menu de navegação">☰</button>@if(auth.user();as user){<div class="account-control"><button type="button" class="avatar" (click)="toggleAccount();$event.stopPropagation()" aria-haspopup="menu" [attr.aria-expanded]="accountOpen()" aria-controls="account-menu">{{initials(user.nome,user.email)}}</button>@if(accountOpen()){<div id="account-menu" class="account-menu" role="menu"><div class="account-summary"><strong>{{user.nome}}</strong><span>{{user.email}}</span><small>{{user.perfil}}</small></div><button type="button" role="menuitem" (click)="closeMenus()">Minha conta</button><button type="button" role="menuitem" (click)="switchAccount()">Trocar conta</button><hr><button type="button" role="menuitem" class="danger" (click)="switchAccount()">Sair da conta</button></div>}</div>}</div></div></header><main class="app-main"><div class="app-content-container"><router-outlet /></div></main></div><section class="toasts" aria-live="polite">@for(toast of notifications.notifications();track toast.id){<button type="button" class="toast" [class]="toast.tone" (click)="notifications.dismiss(toast.id)">{{toast.message}}</button>}</section>
