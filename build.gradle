plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.8'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'CarteiraInvestimento'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-h2console'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.0'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'spring.profiles.active', 'test'

    [
        'spring.datasource.url',
        'spring.datasource.username',
        'spring.datasource.password',
        'spring.datasource.driver-class-name',
        'spring.h2.console.enabled'
    ].each { propertyName ->
        def propertyValue = System.getProperty(propertyName)
        if (propertyValue != null) {
            systemProperty propertyName, propertyValue
        }
    }

    [
        'DB_URL': providers.gradleProperty('smokeDbUrl').orNull,
        'DB_USERNAME': providers.gradleProperty('smokeDbUsername').orNull,
        'DB_PASSWORD': providers.gradleProperty('smokeDbPassword').orNull,
        'DB_DRIVER': providers.gradleProperty('smokeDbDriver').orNull
    ].each { environmentName, propertyValue ->
        if (propertyValue != null) {
            environment environmentName, propertyValue
        }
    }

    [
        'smoke.db.url': providers.gradleProperty('smokeDbUrl').orNull,
        'smoke.db.username': providers.gradleProperty('smokeDbUsername').orNull,
        'smoke.db.password': providers.gradleProperty('smokeDbPassword').orNull,
        'smoke.db.driver': providers.gradleProperty('smokeDbDriver').orNull
    ].each { propertyName, propertyValue ->
        if (propertyValue != null) {
            systemProperty propertyName, propertyValue
        }
    }
}
