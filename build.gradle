import com.github.spotbugs.snom.Confidence
import com.github.spotbugs.snom.Effort

plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.9'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.github.spotbugs' version '6.5.13'
    id 'org.cyclonedx.bom' version '3.5.1'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'CarteiraInvestimento'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-h2console'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.0'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
    spotbugsPlugins 'com.h3xstream.findsecbugs:findsecbugs-plugin:1.14.0'

}

spotbugs {
    toolVersion = '4.10.5'
    ignoreFailures = false
    showStackTraces = true
    showProgress = true
    effort = Effort.valueOf('MAX')
    reportLevel = Confidence.valueOf('MEDIUM')
    includeFilter = file('config/spotbugs/security-filter.xml')
    excludeFilter = file('config/spotbugs/security-exclude.xml')
    omitVisitors = ['CorsRegistryCORSDetector']
    reportsDir = file("$buildDir/reports/spotbugs")
}

tasks.named('spotbugsMain') {
    reports {
        html {
            required = true
            outputLocation = file("$buildDir/reports/spotbugs/main/spotbugs.html")
        }
        xml {
            required = true
            outputLocation = file("$buildDir/reports/spotbugs/main/spotbugs.xml")
        }
    }
}

tasks.named('cyclonedxDirectBom') {
    includeConfigs = ['compileClasspath', 'runtimeClasspath']
    skipConfigs = ['(?i).*test.*']
}

tasks.named('cyclonedxBom') {
    projectType = 'application'
    jsonOutput = layout.projectDirectory.file('security/reports/sbom-backend.json')
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'spring.profiles.active', 'test'

    [
        'spring.datasource.url',
        'spring.datasource.username',
        'spring.datasource.password',
        'spring.datasource.driver-class-name',
        'spring.h2.console.enabled'
    ].each { propertyName ->
        def propertyValue = System.getProperty(propertyName)
        if (propertyValue != null) {
            systemProperty propertyName, propertyValue
        }
    }

    [
        'DB_URL': providers.gradleProperty('smokeDbUrl').orNull,
        'DB_USERNAME': providers.gradleProperty('smokeDbUsername').orNull,
        'DB_PASSWORD': providers.gradleProperty('smokeDbPassword').orNull,
        'DB_DRIVER': providers.gradleProperty('smokeDbDriver').orNull
    ].each { environmentName, propertyValue ->
        if (propertyValue != null) {
            environment environmentName, propertyValue
        }
    }

    [
        'smoke.db.url': providers.gradleProperty('smokeDbUrl').orNull,
        'smoke.db.username': providers.gradleProperty('smokeDbUsername').orNull,
        'smoke.db.password': providers.gradleProperty('smokeDbPassword').orNull,
        'smoke.db.driver': providers.gradleProperty('smokeDbDriver').orNull
    ].each { propertyName, propertyValue ->
        if (propertyValue != null) {
            systemProperty propertyName, propertyValue
        }
    }
}
