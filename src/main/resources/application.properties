spring.application.name=CarteiraInvestimento
spring.profiles.default=dev
server.port=8081
spring.config.import=optional:file:.env[.properties]

# HTTP clients
integration.http.connect-timeout=${HTTP_CONNECT_TIMEOUT:PT5S}
integration.http.read-timeout=${HTTP_READ_TIMEOUT:PT10S}

# External integrations
integrations.brapi.base-url=${BRAPI_BASE_URL:}
integrations.brapi.token=${BRAPI_TOKEN:}


integrations.twelve-data.base-url=${TWELVE_DATA_BASE_URL:https://api.twelvedata.com}
integrations.twelve-data.api-key=${TWELVE_DATA_API_KEY:}

integrations.brasil-api.base-url=${BRASIL_API_BASE_URL:https://brasilapi.com.br}
integrations.viacep.base-url=${VIACEP_BASE_URL:https://viacep.com.br}
integrations.financial-institution.base-url=${FINANCIAL_INSTITUTION_BASE_URL:https://www2.cvm.gov.br}

# Web
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
app.auth.jwt-secret=${AUTH_JWT_SECRET:dev-secret-change-this-value-please}

# OpenAPI
springdoc.api-docs.path=${OPENAPI_API_DOCS_PATH:/api-docs}
springdoc.swagger-ui.path=${OPENAPI_SWAGGER_UI_PATH:/swagger-ui}
