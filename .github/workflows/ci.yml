name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Enable Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Run backend tests
        run: ./gradlew clean test --no-daemon --console=plain

      - name: Build backend without repeating tests
        run: ./gradlew build -x test --no-daemon --console=plain

      - name: Run SpotBugs and FindSecBugs
        run: ./gradlew spotbugsMain --rerun-tasks --no-daemon --console=plain

      - name: Upload backend reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-validation-reports
          if-no-files-found: warn
          path: |
            build/test-results/test
            build/reports/tests/test
            build/reports/spotbugs/main

  frontend:
    name: Frontend validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22.22.3
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test -- --watch=false

      - name: Build frontend
        run: npm run build

      - name: Upload frontend reports and build
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-validation-reports
          if-no-files-found: warn
          path: |
            frontend/dist/frontend
            frontend/coverage
            frontend/test-results

  openspec:
    name: OpenSpec validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22.22.3
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'

      - name: Install npm 12.0.2
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
        run: npm install --global npm@12.0.2 --ignore-scripts

      - name: Verify npm version
        run: test "$(npm --version)" = "12.0.2"

      - name: Install OpenSpec CLI 1.14.3
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
        run: npm install --global @fission-ai/openspec@1.14.3 --ignore-scripts

      - name: Verify OpenSpec CLI version
        run: openspec --version

      - name: Validate OpenSpec change strictly
        run: |
          set +e
          openspec validate "establish-ci-cd-pipeline" --type change --strict > openspec-validation.txt 2>&1
          status=$?
          cat openspec-validation.txt
          exit "$status"

      - name: Upload OpenSpec validation report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: openspec-validation-report
          if-no-files-found: warn
          path: openspec-validation.txt
